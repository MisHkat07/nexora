# Render Blueprint: one web service runs the Express API and serves the built frontend.
services:
  - type: web
    name: nexora
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE
        sync: false # MongoDB connection string, entered in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API
        sync: false
      # Uploads must live in a bucket on Render: the container disk is wiped on every deploy
      - key: STORAGE_DRIVER
        sync: false # set to "s3" once a bucket exists (local uploads are lost on deploy)
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: SENTRY_DSN
        sync: false # optional error tracking
