# Render Blueprint: one web service runs the Express API and serves the built frontend.
services:
  - type: web
    name: nexora
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE
        sync: false # MongoDB connection string, entered in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API
        sync: false
